    <linearGradient id="hxAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7a52f0"/><stop offset="1" stop-color="#2f6dee"/></linearGradient>
  </defs>
  <rect width="600" height="460" rx="22" fill="url(#hxBg)"/>
  <circle cx="110" cy="90" r="66" fill="#7a52f0" opacity=".12"/>
  <circle cx="500" cy="380" r="80" fill="#2f6dee" opacity=".10"/>

