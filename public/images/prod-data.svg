<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Customer data animation">
  <defs>
    <linearGradient id="dBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <linearGradient id="dAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#38e8f2"/><stop offset="1" stop-color="#4d8dff"/></linearGradient>
    <style>
      .f1{opacity:0;transform:translateX(-6px);transform-box:fill-box;animation:fRow 4.5s ease-in-out infinite}
      .f2{opacity:0;transform:translateX(-6px);transform-box:fill-box;animation:fRow 4.5s ease-in-out .4s infinite}
      .f3{opacity:0;transform:translateX(-6px);transform-box:fill-box;animation:fRow 4.5s ease-in-out .8s infinite}
      .f4{opacity:0;transform:translateX(-6px);transform-box:fill-box;animation:fRow 4.5s ease-in-out 1.2s infinite}
      .d-av{transform-box:fill-box;transform-origin:center;animation:dAv 4.5s ease-in-out infinite}
      .d-ch circle{transform-box:fill-box;transform-origin:center;animation:dCh 2.4s ease-in-out infinite}
      .d-ch circle:nth-of-type(2){animation-delay:.2s}
      .d-ch circle:nth-of-type(3){animation-delay:.4s}
      .d-ch circle:nth-of-type(4){animation-delay:.6s}
      @keyframes fRow{0%,12%{opacity:0;transform:translateX(-6px)}25%,92%{opacity:1;transform:translateX(0)}100%{opacity:0}}
      @keyframes dAv{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
      @keyframes dCh{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    </style>
  </defs>
  <rect width="400" height="225" fill="url(#dBg)"/>
  <rect x="92" y="40" width="150" height="146" rx="14" fill="#0c1322" stroke="#38e8f2" stroke-opacity=".24"/>
  <circle class="d-av" cx="120" cy="70" r="16" fill="url(#dAcc)"/>
  <text x="120" y="75" text-anchor="middle" font-family="Arial" font-size="13" font-weight="700" fill="#04121a">RS</text>
  <rect x="146" y="62" width="74" height="6" rx="3" fill="#dfe6f5"/>
  <rect x="146" y="74" width="54" height="5" rx="2.5" fill="#5b6479"/>
  <path d="M104 96h126" stroke="#1c2740"/>
  <text x="104" y="116" font-family="monospace" font-size="8" fill="#828ca3">LIFETIME VALUE</text>
  <text x="104" y="134" font-family="Arial" font-size="16" font-weight="700" fill="#38e8f2">₹2.4L</text>
  <text x="104" y="156" font-family="monospace" font-size="8" fill="#828ca3">CHANNELS</text>
  <g class="d-ch">
    <circle cx="108" cy="170" r="5" fill="#25d366"/><circle cx="122" cy="170" r="5" fill="#38e8f2"/><circle cx="136" cy="170" r="5" fill="#4d8dff"/><circle cx="150" cy="170" r="5" fill="#ffb454"/>
  </g>
  <rect x="254" y="56" width="96" height="114" rx="12" fill="#11192a" stroke="#38e8f2" stroke-opacity=".18"/>
  <text x="266" y="74" font-family="monospace" font-size="8" fill="#828ca3">ACTIVITY</text>
  <g class="f1"><circle cx="270" cy="92" r="3.4" fill="#7af0c8"/><rect x="280" y="89" width="58" height="5" rx="2.5" fill="#3a4359"/></g>
  <g class="f2"><circle cx="270" cy="110" r="3.4" fill="#38e8f2"/><rect x="280" y="107" width="48" height="5" rx="2.5" fill="#3a4359"/></g>
  <g class="f3"><circle cx="270" cy="128" r="3.4" fill="#4d8dff"/><rect x="280" y="125" width="56" height="5" rx="2.5" fill="#3a4359"/></g>
  <g class="f4"><circle cx="270" cy="146" r="3.4" fill="#b98bff"/><rect x="280" y="143" width="40" height="5" rx="2.5" fill="#3a4359"/></g>
</svg>
