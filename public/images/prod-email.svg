<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Email analytics animation">
  <defs>
    <linearGradient id="emBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <style>
      .e-line{stroke-dasharray:120;stroke-dashoffset:120;animation:eLine 4s ease-in-out infinite}
      .e-dot{transform-box:fill-box;transform-origin:center;animation:eDot 4s ease-in-out infinite}
      .e-cta{transform-box:fill-box;transform-origin:center;animation:ePulse 2.6s ease-in-out infinite}
      .e-bars rect{transform-box:fill-box;transform-origin:bottom;animation:eBar 2.2s ease-in-out infinite}
      @keyframes eLine{0%,10%{stroke-dashoffset:120}70%,100%{stroke-dashoffset:0}}
      @keyframes eDot{0%,60%{opacity:0;transform:scale(0)}75%,100%{opacity:1;transform:scale(1)}}
      @keyframes ePulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
      @keyframes eBar{0%,100%{transform:scaleY(.6)}50%{transform:scaleY(1)}}
    </style>
  </defs>
  <rect width="400" height="225" fill="url(#emBg)"/>
  <rect x="104" y="36" width="150" height="154" rx="14" fill="#0c1322" stroke="#ffb454" stroke-opacity=".25"/>
  <rect x="104" y="36" width="150" height="46" rx="14" fill="#191205"/>
  <circle cx="124" cy="59" r="10" fill="#ffb454" opacity=".25"/>
  <path d="M118 56l6 4 6-4" stroke="#ffb454" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="140" y="52" width="64" height="5" rx="2.5" fill="#ffcf8a"/>
  <rect x="140" y="62" width="44" height="4.5" rx="2" fill="#9a7a45"/>
  <rect x="120" y="96" width="118" height="5" rx="2.5" fill="#cdd5e6"/>
  <rect x="120" y="108" width="100" height="4.5" rx="2" fill="#48526a"/>
  <rect x="120" y="118" width="110" height="4.5" rx="2" fill="#48526a"/>
  <rect class="e-cta" x="120" y="146" width="78" height="22" rx="8" fill="#ffb454"/>
  <text x="159" y="161" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="700" fill="#241803">Shop 30% off</text>
  <g transform="translate(266,58)">
    <rect x="0" y="0" width="86" height="64" rx="12" fill="#11192a" stroke="#ffb454" stroke-opacity=".2"/>
    <text x="12" y="20" font-family="monospace" font-size="8" fill="#828ca3">OPEN RATE</text>
    <text x="12" y="40" font-family="Arial" font-size="18" font-weight="700" fill="#ffb454">62%</text>
    <path d="M12 54h62" stroke="#222c40"/>
    <path class="e-line" d="M12 50l12-6 12 3 12-8 14 4" stroke="#ffb454" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle class="e-dot" cx="62" cy="44" r="4.5" fill="#ffd9a0"/>
  </g>
  <g transform="translate(266,134)">
    <rect x="0" y="0" width="86" height="40" rx="12" fill="#11192a"/>
    <g class="e-bars" fill="#ffb454" opacity=".85">
      <rect x="12" y="14" width="6" height="18"/><rect x="24" y="14" width="6" height="18"/><rect x="36" y="14" width="6" height="18"/><rect x="48" y="14" width="6" height="18"/><rect x="60" y="14" width="6" height="18"/><rect x="72" y="14" width="6" height="18"/>
    </g>
  </g>
</svg>
