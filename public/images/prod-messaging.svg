<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Messaging channels animation">
  <defs>
    <linearGradient id="msgBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <style>
      .m-sel{transform-box:fill-box;transform-origin:center;animation:mSel 4.5s ease-in-out infinite}
      .m-check{stroke-dasharray:14;stroke-dashoffset:14;animation:mCheck 4.5s ease-in-out infinite}
      .m-bub{opacity:0;transform-box:fill-box;animation:mBub 4.5s ease-in-out infinite}
      .m-r2{animation:mRow 4.5s ease-in-out infinite}
      .m-r3{animation:mRow 4.5s ease-in-out 2.2s infinite}
      @keyframes mSel{0%,12%{stroke-opacity:.5}20%,100%{stroke-opacity:1}}
      @keyframes mCheck{0%,15%{stroke-dashoffset:14}30%,100%{stroke-dashoffset:0}}
      @keyframes mBub{0%,30%{opacity:0;transform:translateY(6px)}45%,92%{opacity:1;transform:translateY(0)}100%{opacity:0}}
      @keyframes mRow{0%,100%{fill:#11192a}45%,70%{fill:#172033}}
    </style>
  </defs>
  <rect width="400" height="225" fill="url(#msgBg)"/>
  <rect x="116" y="30" width="168" height="166" rx="20" fill="#0c1322" stroke="#38e8f2" stroke-opacity=".22"/>
  <text x="132" y="60" font-family="Arial" font-size="11" font-weight="700" fill="#eef2ff">Choose channel</text>
  <g>
    <rect class="m-sel" x="132" y="72" width="136" height="26" rx="8" fill="#172033" stroke="#25d366"/>
    <circle cx="146" cy="85" r="7" fill="#25d366"/>
    <text x="160" y="89" font-family="Arial" font-size="9.5" fill="#dfe6f5">WhatsApp</text>
    <path class="m-check" d="M256 85l4 4 6-7" stroke="#25d366" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <rect class="m-r2" x="132" y="104" width="136" height="26" rx="8" fill="#11192a"/>
  <circle cx="146" cy="117" r="7" fill="#4d8dff"/><text x="160" y="121" font-family="Arial" font-size="9.5" fill="#aeb7cb">RCS</text>
  <rect class="m-r3" x="132" y="136" width="136" height="26" rx="8" fill="#11192a"/>
  <circle cx="146" cy="149" r="7" fill="#38e8f2"/><text x="160" y="153" font-family="Arial" font-size="9.5" fill="#aeb7cb">SMS &amp; MMS</text>
  <g class="m-bub" transform="translate(286,150)">
    <rect x="0" y="0" width="70" height="40" rx="12" fill="#25d366" opacity=".18"/>
    <rect x="0" y="0" width="70" height="40" rx="12" fill="none" stroke="#25d366" stroke-opacity=".5"/>
    <rect x="10" y="12" width="42" height="4.5" rx="2" fill="#7af0a8"/>
    <rect x="10" y="22" width="30" height="4.5" rx="2" fill="#5fd28d"/>
  </g>
</svg>
