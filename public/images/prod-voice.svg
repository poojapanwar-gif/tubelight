<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Voice call animation">
  <defs>
    <linearGradient id="vBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <linearGradient id="vAcc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38e8f2"/><stop offset="1" stop-color="#b98bff"/></linearGradient>
    <style>
      .wf rect{transform-box:fill-box;transform-origin:center;animation:wf 1s ease-in-out infinite}
      .wf rect:nth-of-type(2n){animation-duration:1.3s}
      .wf rect:nth-of-type(3n){animation-duration:.8s}
      .wf rect:nth-of-type(4n){animation-duration:1.15s}
      .wf rect:nth-of-type(5n){animation-duration:.9s}
      @keyframes wf{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
      .v-ring{transform-box:fill-box;transform-origin:center;animation:vRing 2s ease-out infinite}
      @keyframes vRing{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.8);opacity:0}}
    </style>
  </defs>
  <rect width="400" height="225" fill="url(#vBg)"/>
  <rect x="96" y="44" width="208" height="138" rx="16" fill="#0c1322" stroke="#b98bff" stroke-opacity=".24"/>
