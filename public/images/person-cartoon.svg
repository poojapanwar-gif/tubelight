<svg viewBox="0 0 640 700" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Cartoon illustration of a smiling man holding a laptop">
  <defs>
    <linearGradient id="pcFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e8f2"/><stop offset="0.5" stop-color="#4d8dff"/><stop offset="1" stop-color="#9a7bff"/>
    </linearGradient>
    <linearGradient id="pcLaptop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dfe5ee"/><stop offset="1" stop-color="#aab2c2"/>
    </linearGradient>
    <pattern id="plaid" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="60" height="60" fill="#17574a"/>
      <rect width="60" height="60" fill="#0f3f36" opacity=".5"/>
      <rect x="0" y="0" width="10" height="60" fill="#1c6b59"/>
      <rect x="0" y="0" width="60" height="10" fill="#1c6b59"/>
      <rect x="28" y="0" width="5" height="60" fill="#c0392b" opacity=".85"/>
      <rect x="0" y="28" width="60" height="5" fill="#c0392b" opacity=".85"/>
      <rect x="46" y="0" width="2" height="60" fill="#e08a3c" opacity=".7"/>
      <rect x="0" y="46" width="60" height="2" fill="#e08a3c" opacity=".7"/>
    </pattern>
    <filter id="pcShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>

  <!-- hand-drawn brand frame (behind figure) -->
  <path d="M150 200 C 120 210 110 250 112 320 C 114 430 120 560 150 600 C 175 632 250 612 300 612
           M150 200 C 260 150 470 175 545 235 C 575 260 560 470 540 560 C 528 612 360 628 300 612"
        fill="none" stroke="url(#pcFrame)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- BODY / shirt -->
  <g filter="url(#pcShadow)">
    <!-- shoulders + torso -->
    <path d="M150 690 C 150 540 190 470 250 452 L390 452 C 452 470 492 545 492 690 Z" fill="url(#plaid)"/>
    <!-- inner tee -->
    <path d="M286 452 L356 452 C 352 492 332 512 321 512 C 310 512 290 492 286 452 Z" fill="#3a4250"/>
    <!-- collar -->
    <path d="M286 452 L321 486 L356 452 L342 446 L321 470 L300 446 Z" fill="#0f3f36"/>
  </g>

  <!-- NECK -->
  <path d="M292 408 L350 408 L350 452 C 350 470 292 470 292 452 Z" fill="#a06a44"/>
  <path d="M292 430 C 312 446 330 446 350 430 L350 408 L292 408 Z" fill="#8a5836" opacity=".6"/>

  <!-- HEAD -->
  <g>
    <!-- ears -->
    <circle cx="214" cy="318" r="20" fill="#a86c44"/>
    <circle cx="426" cy="318" r="20" fill="#a86c44"/>
    <!-- face -->
    <path d="M214 300 C 214 196 268 156 320 156 C 372 156 426 196 426 300
             C 426 372 392 432 320 444 C 248 432 214 372 214 300 Z" fill="#b3774d"/>
    <!-- hair -->
    <path d="M210 296 C 200 214 256 150 320 150 C 384 150 440 214 430 296
             C 420 268 404 250 392 250 C 384 224 352 206 320 206 C 288 206 256 224 248 250
             C 236 250 220 268 210 296 Z" fill="#241712"/>
    <path d="M248 250 C 256 234 286 220 320 220 C 354 220 384 234 392 250 C 372 244 348 240 320 240 C 292 240 268 244 248 250 Z" fill="#3a2418" opacity=".7"/>
    <!-- eyebrows -->
    <path d="M252 300 C 268 290 290 290 304 298" fill="none" stroke="#241712" stroke-width="7" stroke-linecap="round"/>
    <path d="M336 298 C 350 290 372 290 388 300" fill="none" stroke="#241712" stroke-width="7" stroke-linecap="round"/>
    <!-- happy closed eyes -->
    <path d="M256 322 C 270 336 292 336 304 324" fill="none" stroke="#2a1b12" stroke-width="6" stroke-linecap="round"/>
    <path d="M336 324 C 350 336 372 336 386 322" fill="none" stroke="#2a1b12" stroke-width="6" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M318 330 C 312 350 306 360 312 368 C 318 372 326 372 332 368" fill="none" stroke="#8a5836" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- big smile: mouth -->
    <path d="M270 374 C 296 410 346 410 372 374 C 356 396 336 404 321 404 C 306 404 286 396 270 374 Z" fill="#6e2b27"/>
    <path d="M281 380 C 300 396 342 396 361 380 C 344 388 298 388 281 380 Z" fill="#ffffff"/>
    <!-- mustache -->
    <path d="M286 360 C 300 372 312 372 320 366 C 328 372 340 372 354 360 C 342 356 330 360 320 364 C 310 360 298 356 286 360 Z" fill="#241712"/>
    <!-- beard -->
    <path d="M222 332 C 226 412 268 470 320 470 C 372 470 414 412 418 332
             C 414 360 398 372 388 374 C 382 392 360 408 321 408 C 282 408 260 392 254 374
             C 244 372 228 360 222 332 Z" fill="#1f140e"/>
    <path d="M236 360 C 248 420 282 452 320 452 C 358 452 392 420 404 360
             C 396 404 360 436 320 436 C 280 436 244 404 236 360 Z" fill="#000000" opacity=".25"/>
  </g>

  <!-- LAPTOP held across chest -->
  <g filter="url(#pcShadow)" transform="rotate(-6 320 600)">
    <rect x="196" y="540" width="248" height="172" rx="14" fill="url(#pcLaptop)"/>
    <rect x="196" y="540" width="248" height="172" rx="14" fill="none" stroke="#8b94a6" stroke-width="3"/>
    <circle cx="320" cy="626" r="22" fill="#9aa3b4"/>
    <circle cx="320" cy="626" r="22" fill="none" stroke="#7d8699" stroke-width="2"/>
    <rect x="304" y="704" width="32" height="6" rx="3" fill="#8b94a6"/>
  </g>
  <!-- forearm over laptop -->
  <path d="M150 690 C 156 612 196 566 250 560 C 300 556 330 612 326 690 Z" fill="url(#plaid)"/>
  <path d="M252 560 C 240 566 224 588 220 620" fill="none" stroke="#0f3f36" stroke-width="4" opacity=".5"/>
  <!-- right hand/cuff -->
  <path d="M430 690 C 470 660 486 612 470 560 L412 580 C 430 612 426 660 430 690 Z" fill="url(#plaid)"/>
  <ellipse cx="362" cy="672" rx="34" ry="26" fill="#a86c44"/>
</svg>
