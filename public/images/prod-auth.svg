<svg viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="User authentication animation">
  <defs>
    <linearGradient id="auBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0e1424"/><stop offset="1" stop-color="#0a0e1a"/></linearGradient>
    <style>
      .d1{opacity:0;animation:fillIn 4.4s ease-in-out infinite}
      .d2{opacity:0;animation:fillIn 4.4s ease-in-out .35s infinite}
      .d3{opacity:0;animation:fillIn 4.4s ease-in-out .7s infinite}
      .b1{animation:boxOn 4.4s ease-in-out infinite}
      .b2{animation:boxOn 4.4s ease-in-out .35s infinite}
      .b3{animation:boxOn 4.4s ease-in-out .7s infinite}
      .au-btn{transform-box:fill-box;transform-origin:center;animation:auBtn 4.4s ease-in-out infinite}
      .au-shield{stroke-dasharray:120;stroke-dashoffset:120;animation:auShield 4.4s ease-in-out infinite}
      @keyframes fillIn{0%,8%{opacity:0}18%,92%{opacity:1}100%{opacity:0}}
      @keyframes boxOn{0%,5%{stroke:#222c40}15%,92%{stroke:#4d8dff}100%{stroke:#222c40}}
      @keyframes auBtn{0%,70%{transform:scale(1);filter:none}80%{transform:scale(1.06)}90%,100%{transform:scale(1)}}
      @keyframes auShield{0%,10%{stroke-dashoffset:120}55%,100%{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="400" height="225" fill="url(#auBg)"/>
  <rect x="120" y="32" width="160" height="160" rx="16" fill="#0c1322" stroke="#4d8dff" stroke-opacity=".26"/>
  <g transform="translate(200,64)">
    <path d="M0 -18l16 6v10c0 10-7 16-16 19-9-3-16-9-16-19v-10z" fill="#4d8dff" opacity=".18"/>
    <path class="au-shield" d="M0 -18l16 6v10c0 10-7 16-16 19-9-3-16-9-16-19v-10z" fill="none" stroke="#4d8dff" stroke-width="2"/>
  </g>
  <text x="200" y="102" text-anchor="middle" font-family="Arial" font-size="11" font-weight="700" fill="#eef2ff">Enter code</text>
  <g>
    <rect class="b1" x="136" y="116" width="24" height="30" rx="7" fill="#11192a" stroke="#222c40"/>
    <text class="d1" x="148" y="137" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#38e8f2">7</text>
    <rect class="b2" x="164" y="116" width="24" height="30" rx="7" fill="#11192a" stroke="#222c40"/>
    <text class="d2" x="176" y="137" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#38e8f2">3</text>
    <rect class="b3" x="192" y="116" width="24" height="30" rx="7" fill="#11192a" stroke="#222c40"/>
    <text class="d3" x="204" y="137" text-anchor="middle" font-family="monospace" font-size="15" font-weight="700" fill="#38e8f2">1</text>
    <rect x="220" y="116" width="24" height="30" rx="7" fill="#11192a" stroke="#222c40"/>
    <rect x="248" y="116" width="24" height="30" rx="7" fill="#11192a" stroke="#222c40"/>
  </g>
  <rect class="au-btn" x="136" y="158" width="128" height="22" rx="8" fill="#4d8dff"/>
  <text x="200" y="173" text-anchor="middle" font-family="Arial" font-size="9.5" font-weight="700" fill="#031024">Verify</text>
</svg>
