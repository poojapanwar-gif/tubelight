    <!-- chat thread -->
    <rect x="256" y="136" width="170" height="34" rx="12" fill="#f1f4f9"/>
    <rect x="268" y="146" width="120" height="6" rx="3" fill="#5f6982"/>
    <rect x="268" y="157" width="80" height="5" rx="2.5" fill="#aab4c6"/>
    <rect x="320" y="184" width="170" height="34" rx="12" fill="#e7fbef"/>
    <rect x="332" y="194" width="120" height="6" rx="3" fill="#2e7d4f"/>
    <rect x="332" y="205" width="84" height="5" rx="2.5" fill="#88c4a2"/>
