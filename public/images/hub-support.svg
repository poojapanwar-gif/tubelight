      <rect x="144" y="208" width="40" height="5" rx="2.5" fill="#9aa4ba"/>
    </g>
    <g opacity=".7">
      <circle cx="124" cy="251" r="12" fill="#7a52f0"/>
      <rect x="144" y="242" width="62" height="6" rx="3" fill="#33415a"/>
