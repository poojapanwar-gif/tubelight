    <linearGradient id="hsAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1eb858"/><stop offset="1" stop-color="#0bb4c4"/></linearGradient>
  </defs>
  <rect width="600" height="460" rx="22" fill="url(#hsBg)"/>
  <circle cx="510" cy="90" r="70" fill="#1eb858" opacity=".10"/>
  <circle cx="90" cy="380" r="74" fill="#0bb4c4" opacity=".12"/>

  <!-- inbox window -->
