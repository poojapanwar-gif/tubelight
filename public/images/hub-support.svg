    <path d="M429 331v-2a7 7 0 0 1 14 0v2M428 330h3v7h-3a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1Zm13 0h3a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1h-3v-7Z" fill="none" stroke="#1eb858" stroke-width="2" stroke-linejoin="round"/>
