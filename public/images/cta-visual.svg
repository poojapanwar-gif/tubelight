<svg viewBox="0 0 640 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered gradient visual">
  <defs>
    <linearGradient id="cvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1426"/><stop offset="1" stop-color="#0a0e1a"/>
    </linearGradient>
    <linearGradient id="cvWave" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38e8f2"/><stop offset="0.5" stop-color="#4d8dff"/><stop offset="1" stop-color="#9a7bff"/>
    </linearGradient>
    <radialGradient id="cvOrb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfeaff"/><stop offset="0.45" stop-color="#4d8dff"/><stop offset="1" stop-color="#1a2f7a" stop-opacity="0"/>
    </radialGradient>
    <filter id="cvBlur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="640" height="520" rx="20" fill="url(#cvBg)"/>
  <!-- layered gradient waves -->
  <g opacity=".9">
    <path d="M0 360 C 160 300 300 420 640 340 L640 520 L0 520Z" fill="url(#cvWave)" opacity=".22"/>
    <path d="M0 400 C 180 340 320 460 640 380 L640 520 L0 520Z" fill="url(#cvWave)" opacity=".30"/>
    <path d="M0 440 C 200 380 340 500 640 420 L640 520 L0 520Z" fill="url(#cvWave)" opacity=".42"/>
  </g>
  <!-- glowing orb -->
  <circle cx="320" cy="220" r="150" fill="url(#cvOrb)" filter="url(#cvBlur)"/>
  <!-- tube mark -->
  <g transform="translate(320,220)">
    <rect x="-78" y="-22" width="156" height="44" rx="22" fill="#ffffff" opacity=".96"/>
    <rect x="-78" y="-22" width="156" height="44" rx="22" fill="none" stroke="#bfe7ff" stroke-width="1.5"/>
  </g>
  <!-- orbit ring -->
  <circle cx="320" cy="220" r="186" fill="none" stroke="#7fb0ff" stroke-opacity=".3" stroke-dasharray="3 9"/>
  <circle cx="320" cy="220" r="220" fill="none" stroke="#9a7bff" stroke-opacity=".18"/>
</svg>
